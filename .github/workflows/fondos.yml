name: Actualizar fondos
on:
  schedule:
    - cron: '17 11 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fondos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests pdfplumber
      - run: python actualizar_fondos.py
      - name: Guardar cambios
        run: |
          git config user.name "afi-pro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fondos.json fondos_debug
          git diff --cached --quiet || git commit -m "Datos de fondos $(date -u +%F)"
          git pull --rebase --quiet
          git push
